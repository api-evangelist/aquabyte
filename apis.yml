aid: aquabyte
name: Aquabyte
description: 'Aquabyte AS is a Norwegian-American aquaculture technology company, founded
  in 2017 with offices in Bergen (Laksevåg), Norway, San Francisco and Chile, that applies
  computer vision and machine learning to salmon and trout farming. Underwater cameras
  (Hydra 360, Hammerhead, Atlas) stream imagery into a cloud platform that produces
  biomass and weight estimation, sea-lice counting, welfare scoring, swim-speed and
  breathing-index behaviour metrics, environmental readings and feeding decision support,
  from smolt through harvest. Customers reach that data either through the Aquabyte
  customer portal at app.aquabyte.ai or through the Aquabyte Public API — a documented,
  API-key-authenticated REST service at api.aquabyte.ai/v3 whose OpenAPI 3.1 definition
  is served publicly at api.aquabyte.ai/openapi.json and rendered with ReDoc at /v3/docs.'
