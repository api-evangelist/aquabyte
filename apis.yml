apis:
- name: Aquabyte Public API
  description: 'Read-only REST API over Aquabyte''s aquaculture monitoring data. Version
    v3.1 exposes site and pen inventory plus historical and latest time-series for
    biomass (including harvest reports), sea-lice counts, welfare scores, behaviour
    (swim speed, swim tilt, breathing index) and environmental readings. v3.1 moved
    penId from a path segment to a query parameter and added penId=all bulk fetching
    with nextToken cursor pagination capped at 10,000 records per page; the equivalent
    /pens/{penId}/... operations from v3.0 remain but are marked deprecated in the
    specification. Authentication is a per-customer API key sent in an apikey request
    header, and requests are limited to 1,000 per hour.'
