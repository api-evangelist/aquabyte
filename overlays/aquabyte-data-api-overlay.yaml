overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Aquabyte Public API
  version: 1.0.0
extends: openapi/aquabyte-data-api-openapi.yml
x-apievangelist:
  generated: '2026-08-06'
  method: generated
  source: openapi/aquabyte-data-api-openapi.yml
  note: >-
    Non-destructive enhancements over the specification Aquabyte serves at
    api.aquabyte.ai/openapi.json. The largest single gap this overlay closes is the missing
    securitySchemes object — the API is API-key authenticated and enforces it (401 on an
    unauthenticated call), but the specification never says so in machine-readable form.
    Applying this overlay makes the auth contract, the rate limit and the deprecation
    replacements readable by a generator or an agent. The original document is never
    mutated.
actions:
- target: $.info
  update:
    x-apievangelist-profile: https://apis.io/provider/aquabyte
    x-apievangelist-rate-limit:
      requests: 1000
      period: hour
      scope: api-key
      source: info.description
    x-apievangelist-result-cap:
      records: 10000
      pagination: cursor
      cursor_param: nextToken
    x-apievangelist-contact: info@apievangelist.com

- target: $.components
  update:
    securitySchemes:
      apikey:
        type: apiKey
        in: header
        name: apikey
        description: >-
          Per-customer API key issued by Aquabyte, sent on every request as the `apikey`
          header. Documented in info.description of the published specification; added here
          because the source document declares no securitySchemes.

- target: $
  update:
    security:
    - apikey: []

- target: $.paths['/pens/{penId}/environmental'].get
  update:
    x-replaced-by: get_environmental_environmental_get
    x-sunset-note: Use GET /environmental?penId={penId}

- target: $.paths['/pens/{penId}/environmental/latest'].get
